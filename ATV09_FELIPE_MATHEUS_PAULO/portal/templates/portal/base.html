{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'portal/img/trio_devs_favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'portal/css/style.css' %}">
    <title>{{ conteudo.titulo }} | TRIO DEVS</title>
</head>
<body>
<div class="pagina" id="home">
    <header id="cabecalho" class="cabecalho-rodape">
        <h1 id="titulo-cabecalho">TRIO DEVS</h1>
    </header>
    <main id="menu-conteudo">
        <nav id="menu" aria-label="Navegação principal">
            {% for item in itens_menu %}
                {% if item.tipo_destino == "interno" %}
                    <a class="menu-link" href="{{ item.get_absolute_url }}">{{ item.titulo }}</a>
                {% else %}
                    <a class="menu-link" href="{{ item.url_externa }}" target="_blank" rel="noopener noreferrer">{{ item.titulo }}</a>
                {% endif %}
            {% empty %}
                <p class="menu-vazio">Cadastre itens de navegação no Django Admin.</p>
            {% endfor %}
        </nav>
        <div id="conteudo" aria-live="polite">
            {{ conteudo.html|safe }}
        </div>
    </main>
    <footer id="rodape" class="cabecalho-rodape"><h2>2026</h2></footer>
</div>
</body>
</html>
