<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/trio_devs_favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <title>TRIO DEVS</title>
    
    
</head>
<body>


<noscript>
    Atenção! Este site precisa do JavaScript ativado para funcionar corretamente. <br>
    Ative o JavaScript no seu navegador, ou acesse com um navegador que tenha suporte!
</noscript>

    

<div class="pagina" id="home">


    <!-- CABEÇALHO -->
    <header id="cabecalho" class="cabecalho-rodape">

        <h1 id="titulo-cabecalho">TRIO DEVS</h1>
        
    </header>


    <main id="menu-conteudo">

        <!-- MENU LATERAL -->
        <nav id="menu">

            <button onclick="voltar_capa()">INÍCIO</button>

            <h2>FELIPE</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-felipe.htm', 'FELIPE')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-felipe.htm', 'FELIPE')">Player Tauz</button>


            <h2>MATHEUS</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-matheus.htm', 'MATHEUS')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-matheus.htm','MATHEUS')">Alice in Chains</button>


            <h2>PAULO</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-paulo.htm', 'PAULO')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-paulo.htm', 'PAULO')">Dragon Ball Z</button>


            <h2>CONTATO</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('contato.htm', 'CONTATO')">Formulário</button>
            <a id="link-pesquisa" href="./pesquisa_validacao.pdf" download>Baixar Pesquisa (PDF)</a>
        
        </nav>
        


        <!-- CONTEÚDO -->
        <div id="conteudo">

            <div id="capa">
                <img src="./img/trio_devs.png" alt="capa trio de devs" width="100%">
            </div>
            
        </div>



        <!-- script -->
        <script>

            // função para mudar o conteúdo
            async function conteudo_fuction(arquivo, nome) {
                document.getElementById('conteudo').innerHTML = await (await fetch(arquivo)).text()         // para puxar o arquivo no servidor, esperar e converter em texto
                document.getElementById('titulo-cabecalho').innerHTML = nome                                // para mudar o título
            }


            // para voltar para a capa
            const capa = document.getElementById('conteudo').innerHTML      // armazena

            function voltar_capa() {
                document.getElementById('conteudo').innerHTML = capa                  // escreve o conteúdo armazenado
                document.getElementById('titulo-cabecalho').innerHTML = 'TRIO DEVS'   // muda o título tamb´me
            }


            // função do formulário de Contato (contato.htm) ➡ fica aqui porque scripts dentro
            // de um fragmento carregado via innerHTML não são executados pelo navegador
            function revisarEnvio(evento) {
                evento.preventDefault();     // impede o envio automático inicial

                const form = evento.target;

                // garante que a validação nativa (required, pattern, minlength...) já passou
                if (!form.checkValidity()) {
                    form.reportValidity();   // mostra a mensagem nativa do navegador
                    return false;
                }

                const nome = form.nome.value;
                const email = form.email.value;
                const telefone = form.telefone.value;
                const assunto = form.assunto.options[form.assunto.selectedIndex].text;
                const perfilSelecionado = form.querySelector('input[name="perfil"]:checked');
                const perfil = perfilSelecionado ? perfilSelecionado.value : '';
                const mensagem = form.mensagem.value;

                const resumo =
                    "Revise os dados antes de enviar:\n\n" +
                    "Nome: " + nome + "\n" +
                    "E-mail: " + email + "\n" +
                    "Telefone: " + telefone + "\n" +
                    "Assunto: " + assunto + "\n" +
                    "Perfil: " + perfil + "\n" +
                    "Mensagem: " + mensagem;

                if (confirm(resumo)) {
                    form.submit();     // Confirmar --> envio real via GET
                }
                // Cancelar --> não faz nada, o formulário permanece preenchido para correção

                return false;
            }


            // HTML da tela de sucesso (fica só como texto aqui, pronto pra ser injetado no #conteudo)
            const processamentoHTML = `
                <section id="secao-processamento">
                    <div id="caixa-sucesso">

                        <h2 id="titulo-sucesso">Mensagem enviada com sucesso!</h2>

                        <p id="mensagem-personalizada">
                            Obrigado, <strong id="destaque-nome"></strong>! Recebemos sua mensagem e enviaremos uma
                            confirmação para <strong id="destaque-email"></strong> em breve.
                        </p>

                        <table id="tabela-resumo-envio">
                            <tr>
                                <th>Telefone</th>
                                <td id="resumo-telefone"></td>
                            </tr>
                            <tr>
                                <th>Assunto</th>
                                <td id="resumo-assunto"></td>
                            </tr>
                            <tr>
                                <th>Perfil</th>
                                <td id="resumo-perfil"></td>
                            </tr>
                            <tr>
                                <th>Mensagem</th>
                                <td id="resumo-mensagem"></td>
                            </tr>
                        </table>

                        <button id="link-voltar" onclick="voltar_capa()">Voltar para o início</button>

                    </div>
                </section>
            `;


            // mostra a tela de sucesso dentro do #conteudo, preenchida com os dados capturados da URL
            function mostrarProcessamento() {
                document.getElementById('conteudo').innerHTML = processamentoHTML
                document.getElementById('titulo-cabecalho').innerHTML = 'CONTATO'

                // captura os parâmetros anexados na URL pelo envio do formulário (method="GET")
                const parametros = new URLSearchParams(window.location.search)

                const nome = parametros.get('nome')
                const email = parametros.get('email')

                // mensagem de sucesso personalizada com nome e e-mail capturados da URL
                document.getElementById('destaque-nome').textContent = nome || 'visitante'
                document.getElementById('destaque-email').textContent = email || 'não informado'

                // dados complementares, também capturados via URLSearchParams
                document.getElementById('resumo-telefone').textContent = parametros.get('telefone') || '-'
                document.getElementById('resumo-assunto').textContent = parametros.get('assunto') || '-'
                document.getElementById('resumo-perfil').textContent = parametros.get('perfil') || '-'
                document.getElementById('resumo-mensagem').textContent = parametros.get('mensagem') || '-'

                // limpa a URL (tira o ?nome=...&email=...) sem recarregar a página,
                // assim um F5 não fica reexibindo a mesma tela de sucesso
                window.history.replaceState({}, '', 'index.htm')
            }


            // ao carregar a página, confere se ela veio de um envio do formulário (GET com ?nome=...)
            const parametrosDaURL = new URLSearchParams(window.location.search)
            if (parametrosDaURL.has('nome') || parametrosDaURL.has('email')) {
                mostrarProcessamento()
            }

        </script>

    </main>


    <!-- RODAPÉ -->
    <footer id="rodape" class="cabecalho-rodape">
        <h2>2026</h2>
    </footer>

</div>
    
</body>
</html>
