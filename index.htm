<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style.css">
    <title>TRIO DEVS</title>
    
    
</head>
<body>


<noscript>
    Atenção! Este site precisa do JavaScript ativado para funcionar corretamente. <br>
    Ative o JavaScript no seu navegador, ou acesse com um navegador que tenha suporte!
</noscript>

    

<div class="pagina" id="home">


    <!-- CABEÇALHO -->
    <header id="cabecalho" class="cabecalho-rodape">

        <h1 id="titulo-cabecalho">TRIO DEVS</h1>
        
    </header>


    <main id="menu-conteudo">

        <!-- MENU LATERAL -->
        <nav id="menu">

            <button onclick="voltar_capa()">INÍCIO</button>

            <h2>FELIPE</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-felipe.htm', 'FELIPE')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-felipe.htm', 'FELIPE')">Player Tauz</button>


            <h2>MATHEUS</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-matheus.htm', 'MATHEUS')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-matheus.htm','MATHEUS')">Alice in Chains</button>


            <h2>PAULO</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('curriculo-paulo.htm', 'PAULO')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre-paulo.htm', 'PAULO')">Dragon Ball Z</button>


            <h2>CONTATO</h2>
            <span class="borda"></span> <br>
            <button onclick="conteudo_fuction('formulario.htm', 'FORMULÁRIO')">Formulário</button>


            <a id="link-pesquisa" href="./pesquisa_validacao.pdf" download="">Baixar pesquisa (PDF)</a>

        </nav>
        


        <!-- CONTEÚDO -->
        <div id="conteudo">

            <div id="capa">
                <img src="./img/trio_devs.png" alt="capa trio de devs" width="100%">
            </div>
            
        </div>



        <!-- script -->
        <script>

            // função para mudar o conteúdo
            async function conteudo_fuction(arquivo, nome, url) {
                document.getElementById('conteudo').innerHTML = await (await fetch(arquivo)).text()         // para puxar o arquivo no servidor, esperar e converter em texto
                document.getElementById('titulo-cabecalho').innerHTML = nome                                // para mudar o título

                if (url) {
                    window.history.replaceState({}, '', 'index.htm')    /* para limpar a informações do formulário da url*/
                }
            }



            // para voltar para a capa
            const capa = document.getElementById('conteudo').innerHTML      // armazena

            function voltar_capa() {
                document.getElementById('conteudo').innerHTML = capa                  // escreve o conteúdo armazenado
                document.getElementById('titulo-cabecalho').innerHTML = 'TRIO DEVS'   // muda o título também
            }




            // ------------------------------------------------






            // função para revisar o envio do formulário antes de envia-lo
            function revisarEnvio(evento) {
                evento.preventDefault()      // evita que o navegador valide o formulário automaticamente

                const form = evento.target  // guarda as informações do formulário de forma organizada
                

                if (!form.checkValidity()) {    // verifica se todos os campos estão válidos --> a '!' inverte o resultado para que entre no 'if', então se tiver algo inválido ele vai entrar no 'if'
                    form.reportValidity()       // aponta para o problema que está invalidando o formulário
                    return false                // cancelando o envio do formulário --> até que o campo problemático seja corrigido
                }
                

                const nome = form.nome.value
                const email = form.email.value
                const telefone = form.fone.value
                const mensagem = form.mensagem.value

                const assunto = form.assunto.options[form.assunto.selectedIndex].text       // retorna o option selecionado

                /* EXPLICAÇÃO:
                    
                    form.assunto.options : lista de todos os options
                    form.assunto.selectedIndex : index do option selecionado
                    .text : pega o texto visível (o que está escrito dentro do option) --> se fosse .value pegaria o valor do atributo value
                */


                const perfilSelecionado = form.querySelector('input[name="perfil"]:checked')    // retorna o input selecionado --> literalmente o input
                const perfil = perfilSelecionado ? perfilSelecionado.value : ""                 // if de uma linha --> abaixo está como seria normalmente

                /* 
                let perfil

                if (perfilSelecionado) {                // no JS, qualquer valor diferente de: [false, 0, null, "", undefined, NaN] é true
                    perfil = perfilSelecionado.value
                }
                else {
                    perfil = ""
                }
                */

                /* variável com o resumo do que foi preenchido nos campos do formulário*/
                const resumo =
                "Revise os dados antes de enviar:\n\n" +
                "Nome: " + nome + "\n" +
                "Email: " + email + "\n" +
                "Telefone: " + telefone + "\n" +
                "Assunto: " + assunto + "\n" +
                "Perfil: " + perfil + "\n" +
                "Mensagem: " + mensagem + "\n";


                if (confirm(resumo)) {      // aparece uma tela de confirmação com o texto armazenado na variável 'resumo' --> se clicar em OK, é retornado true e o 'if' é executado, se clicar em Cancelar, é retornado false e o if não é retornado
                    form.submit()          // enviar o formulário --> mas diferente do botão com type="submit" (que entra nessa função pelo atributo onsubmit), o .submit() envia o formulário diretamente, evitando um loop 
                }
                

                return false              // encerra a função e retorna um valor --> o valor é false, devido ao que foi deixado lá no form do 'formulario.htm', pois quando clicamos no botão, o navegador por padrão já quer enviar o formulário, mas com o 'onsubmit' barramos isso, pois mandamos ele olhar primeiro o que tem no 'onsubmit', que no caso foi essa função, acima temos o 'form.submit()' que enviou o formulário, então se deixasse true, o formulário seria enviado duas vezes, então por isso deve ser false
                
            }
            


            // ------------------------------------------------

            

            // para carregar a tela de sucesso ao enviar o formulário
            const parametrosDaURL = new URLSearchParams(window.location.search)

            if (parametrosDaURL.has('nome') || parametrosDaURL.has('email')) {
                sucesso()
            }


            // tela de sucesso
           function sucesso() {
                conteudo_fuction("sucesso.htm", "FORMULÁRIO", "url")     /* chamando a tela de sucesso*/


            }


            

            
        </script>

    </main>


    <!-- RODAPÉ -->
    <footer id="rodape" class="cabecalho-rodape">
        <h2>2026</h2>
    </footer>

</div>
    
</body>
</html>
